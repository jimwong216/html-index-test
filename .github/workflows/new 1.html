<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 程式碼分析與重構平台 (雲端協作版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-6">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-400">AI 程式碼分析與重構平台</h1>
            <p class="text-gray-400 text-sm mt-1">支援手機與跨網段，隨時隨地雲端運算</p>
        </header>

        <!-- 設定區：輸入免費 API Key -->
        <div class="bg-gray-800 p-4 rounded-lg shadow-md mb-6">
            <label class="block text-xs font-semibold mb-1 text-gray-300">設定 API Key (可使用 Groq 或 Gemini 免費金鑰)</label>
            <input type="password" id="api-key-input" class="w-xl max-w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-blue-500" placeholder="貼上你的 API Key...">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 左側：輸入區 -->
            <div class="bg-gray-800 p-4 md:p-5 rounded-lg shadow-lg flex flex-col">
                <label class="block text-sm font-semibold mb-2 text-gray-300">原始程式碼</label>
                <textarea id="code-input" rows="10" class="w-full bg-gray-900 border border-gray-700 rounded p-3 font-mono text-sm focus:outline-none focus:border-blue-500" placeholder="在此貼上你的程式碼..."></textarea>

                <label class="block text-sm font-semibold mt-4 mb-2 text-gray-300">修改或分析要求</label>
                <input type="text" id="instruction-input" class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-sm focus:outline-none focus:border-blue-500" placeholder="例如：加入錯誤處理與型態提示">

                <button onclick="submitCode()" id="submit-btn" class="mt-5 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition duration-200 cursor-pointer">
                    執行雲端分析與修改
                </button>
            </div>

            <!-- 右側：輸出區 -->
            <div class="bg-gray-800 p-4 md:p-5 rounded-lg shadow-lg flex flex-col">
                <label class="block text-sm font-semibold mb-2 text-gray-300">分析與修改結果</label>
                <div id="output-result" class="w-full h-full bg-gray-900 border border-gray-700 rounded p-3 font-mono text-sm overflow-auto whitespace-pre-wrap text-gray-300 min-h-[300px] md:min-h-[350px]">
                    等待執行結果...
                </div>
            </div>
        </div>
    </div>

    <script>
        async function submitCode() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const code = document.getElementById('code-input').value.trim();
            const instruction = document.getElementById('instruction-input').value.trim();
            const outputDiv = document.getElementById('output-result');
            const submitBtn = document.getElementById('submit-btn');

            if (!apiKey) {
                alert('請先輸入 API Key！');
                return;
            }
            if (!code || !instruction) {
                alert('請填寫程式碼以及修改要求！');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '雲端 AI 思考中...';
            outputDiv.textContent = '正在透過雲端 API 進行運算...';

            // 以 Groq 兼容介面為例（或可替換為你選用的雲端大模型 API 端點）
            const apiUrl = 'https://api.groq.com/openai/v1/chat/completions';
            
            const prompt = `你是一個頂級的資深軟體架構師。請分析以下程式碼，並根據使用者的要求進行修改。

【原始程式碼】
\`\`\`
${code}
\`\`\`

【修改要求】
${instruction}

【輸出格式要求】
請分兩部分回覆：
1. 【分析報告】：簡述這段程式碼原本的功能、結構與潛在問題。
2. 【修改後代碼】：提供完整、優化且無語法錯誤的程式碼（使用 Markdown 程式碼區塊包覆）。`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile", // 免費且極速的高級開源模型
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.2
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    outputDiv.textContent = data.choices[0].message.content;
                } else {
                    outputDiv.textContent = `API 錯誤: ${data.error?.message || '未知錯誤'}`;
                }
            } catch (error) {
                outputDiv.textContent = `連線失敗: 無法連接到雲端 API 服務 (${error.message})`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '執行雲端分析與修改';
            }
        }
    </script>
</body>
</html>
